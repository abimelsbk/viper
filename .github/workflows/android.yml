name: Build Android app

# Builds the Viper companion app (android/) and publishes Viper-Android.apk to the
# rolling "android-latest" prerelease. Tagged builds also attach it to that tag's release.

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - ".github/workflows/android.yml"
    tags:
      - "*"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      # Optional release signing. Add these repository secrets to sign with your own key:
      #   VIPER_KEYSTORE_B64 (base64 of the .jks), VIPER_KEYSTORE_PASSWORD, VIPER_KEY_ALIAS, VIPER_KEY_PASSWORD
      # Without them the APK is signed with a throwaway debug key (installs fine, but updates
      # need an uninstall first because the key changes between builds).
      - name: Prepare signing key
        env:
          KEYSTORE_B64: ${{ secrets.VIPER_KEYSTORE_B64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/viper.jks"
            echo "VIPER_KEYSTORE_PATH=$RUNNER_TEMP/viper.jks" >> "$GITHUB_ENV"
            echo "Signing with the repository key."
          else
            echo "No signing secrets - using a debug key."
          fi

      - name: Build APK
        env:
          VIPER_KEYSTORE_PASSWORD: ${{ secrets.VIPER_KEYSTORE_PASSWORD }}
          VIPER_KEY_ALIAS: ${{ secrets.VIPER_KEY_ALIAS }}
          VIPER_KEY_PASSWORD: ${{ secrets.VIPER_KEY_PASSWORD }}
          VIPER_VERSION_CODE: ${{ github.run_number }}
          VIPER_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.17-{0}', github.run_number) }}
        run: |
          gradle -p android --no-daemon assembleRelease
          cp android/app/build/outputs/apk/release/app-release.apk Viper-Android.apk
          ls -la Viper-Android.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Viper-Android
          path: Viper-Android.apk

      - name: Publish to android-latest
        if: github.ref_type == 'branch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-latest
          name: Viper Android app (latest build)
          prerelease: true
          make_latest: false
          files: Viper-Android.apk
          body: |
            Latest build of the Viper companion app, from commit ${{ github.sha }}.
            Install: download Viper-Android.apk on your phone and open it (allow "install unknown apps").

      - name: Attach to tagged release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          files: Viper-Android.apk

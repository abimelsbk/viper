; Viper for a bare ESP32-WROOM-32 dev board (no screen, no buttons).
;
; On boot Viper starts its own access point (ViperNet / vipernet by default) and the
; web interface. Join the AP and open http://172.0.0.1 (or http://viper.local):
; the WebUI "Navigator" mirrors the full menu, and "Serial Cmd" runs CLI commands.
;
; Want a screen? Flash esp-wroom32-ili9341 or esp-wroom32-st7789 instead and wire
; the panel + 5 buttons as described in those boards' connections.md.

[env:esp32-wroom-headless]
board = esp32
monitor_speed = 115200
board_build.partitions = custom_4Mb_full.csv
build_src_filter = ${env.build_src_filter} +<../boards/esp32-wroom-headless>
build_flags =
	${env.build_flags}
	-Iboards/esp32-wroom-headless
	-DCORE_DEBUG_LEVEL=0  ; Arduino core log verbosity (0=none .. 5=verbose)

	; ==================== Library Flags ====================
	; No panel: DisplayDrivers' no-op backend. Every draw call still feeds the WebUI
	; screen mirror (Navigator), but nothing is sent to hardware.
	-DUSE_DUMMY_TFT=1

	; ==================== Environment Flags ====================
	-DALLOW_ALL_GPIO_FOR_IR_RF=1  ; Let the user pick any GPIO for IR/RF from the WebUI
	-DROTATION=1
	-DBTN_ALIAS='"OK"'
	-DDEVICE_NAME='"ESP32-WROOM Headless"'

lib_deps =
	${env.lib_deps}
lib_ignore =
	FastLED
	ESP8266Audio
	ESP8266SAM
